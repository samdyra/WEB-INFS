{% extends "mockup/base.html" %}
{% block title %}Create Project — GeoMetaAssist{% endblock %}
{% block nav_projects %}active{% endblock %}

{% block breadcrumb %}
<li class="breadcrumb-item"><a href="{% url 'dashboard' %}" class="text-decoration-none">Projects</a></li>
<li class="breadcrumb-item active">Create New Project</li>
{% endblock %}

{% block content %}
<h1 class="page-title mb-4">Create New Project</h1>

<div class="card border-0 shadow-sm" style="max-width: 640px;">
  <div class="card-body p-4">
    <form>
      <div class="mb-3">
        <label class="form-label fw-medium">Project Name</label>
        <input type="text" class="form-control" placeholder="e.g. Brisbane Flood Extent 2023">
      </div>
      <div class="mb-4">
        <label class="form-label fw-medium">Description</label>
        <textarea class="form-control" rows="4" placeholder="Describe the purpose of this project and the datasets it will contain..."></textarea>
      </div>
      <div class="d-flex gap-2">
        <a href="{% url 'dashboard' %}" class="btn btn-gma">Save</a>
        <a href="{% url 'dashboard' %}" class="btn btn-outline-secondary">Cancel</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
