<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}GeoMetaAssist{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <style>
    :root {
      --gma-green-dark:   #1a3c2e;
      --gma-green-mid:    #2d6a4f;
      --gma-green-accent: #40916c;
      --gma-green-light:  #d8f3dc;
      --gma-green-pale:   #f0faf2;
      --gma-text-primary: #1a1a1a;
      --gma-text-muted:   #515960;
      --gma-border:       #dee2e6;
    }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      font-size: 0.9rem;
      color: var(--gma-text-primary);
    }
    .text-muted {
      color: var(--gma-text-muted) !important;
    }
    .page-title {
      font-size: 1.4rem;
      font-weight: 600;
    }
    .section-label {
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--gma-text-muted);
    }
    .btn-gma {
      background: var(--gma-green-mid);
      color: #fff;
      border: none;
    }
    .btn-gma:hover {
      background: var(--gma-green-dark);
      color: #fff;
    }
    .navbar-brand {
      font-weight: 700;
      color: var(--gma-green-dark) !important;
      font-size: 1.15rem;
    }
    .badge-gma {
      background: var(--gma-green-light);
      color: var(--gma-green-dark);
      font-weight: 500;
    }
  </style>
  {% block extra_css %}{% endblock %}
</head>
<body>

<nav class="navbar navbar-expand-md bg-white border-bottom">
  <div class="container">
    <a class="navbar-brand" href="{% url 'landing' %}">
      <i class="bi bi-globe-americas me-1" style="color: var(--gma-green-mid);"></i>
      GeoMetaAssist
    </a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#publicNav" aria-controls="publicNav" aria-expanded="false" aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse justify-content-end" id="publicNav">
      <div class="d-flex align-items-center gap-2 mt-2 mt-md-0">
        <a href="{% url 'login' %}" class="btn btn-outline-secondary btn-sm">Log in</a>
        <a href="{% url 'register' %}" class="btn btn-gma btn-sm">Get Started</a>
      </div>
    </div>
  </div>
</nav>

{% block content %}{% endblock %}

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
