<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Something Went Wrong — GeoMetaAssist</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <style>
    :root {
      --gma-green-dark:   #1a3c2e;
      --gma-green-mid:    #2d6a4f;
      --gma-green-accent: #40916c;
      --gma-green-light:  #d8f3dc;
      --gma-green-pale:   #f0faf2;
      --gma-text-primary: #1a1a1a;
      --gma-text-muted:   #6c757d;
      --gma-border:       #dee2e6;
    }
    body {
      background: #fff;
      color: var(--gma-text-primary);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }
    .error-wrap {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem 1rem;
      text-align: center;
    }
    .brand {
      font-weight: 700;
      color: var(--gma-green-dark);
      font-size: 1.1rem;
      margin-bottom: 2.5rem;
    }
    .brand i { color: var(--gma-green-mid); margin-right: 0.35rem; }
    .error-code {
      font-size: 5rem;
      font-weight: 800;
      color: var(--gma-green-dark);
      line-height: 1;
      margin: 0;
    }
    .error-heading {
      font-size: 1.4rem;
      font-weight: 600;
      margin: 0.75rem 0 0.5rem;
    }
    .error-body {
      color: var(--gma-text-muted);
      max-width: 460px;
      margin: 0 auto 1.75rem;
      font-size: 0.95rem;
      line-height: 1.5;
    }
    .btn-gma {
      background: var(--gma-green-mid);
      color: #fff;
      border: 1px solid var(--gma-green-mid);
    }
    .btn-gma:hover { background: var(--gma-green-dark); color: #fff; }
    .footer-note {
      margin-top: 3rem;
      color: var(--gma-text-muted);
      font-size: 0.8rem;
    }
  </style>
</head>
<body>
  <div class="error-wrap">
    <div class="brand"><i class="bi bi-globe-americas"></i>GeoMetaAssist</div>
    <h1 class="error-code">500</h1>
    <h2 class="error-heading">Something Went Wrong</h2>
    <p class="error-body">An unexpected error occurred on our end. Please try again or contact support if the issue persists.</p>
    <div class="d-flex gap-2 flex-wrap justify-content-center">
      <a href="/dashboard/" class="btn btn-gma px-4">Back to Dashboard</a>
    </div>
    <div class="footer-note">&copy; 2026 GeoMetaAssist</div>
  </div>
</body>
</html>
