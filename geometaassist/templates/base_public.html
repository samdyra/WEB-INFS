{% load static %}<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}GeoMetaAssist{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="{% static 'css/main.css' %}" rel="stylesheet">
  {% block extra_css %}{% endblock %}
</head>
<body>

<a href="#main-content" class="skip-link">Skip to main content</a>

<!-- NAVBAR -->
<nav class="navbar navbar-expand-md bg-white border-bottom">
  <div class="container">
    <a class="navbar-brand" href="{% url 'landing' %}">
      <i class="bi bi-globe-americas me-1" style="color: var(--gma-green-mid);"></i>
      GeoMetaAssist
    </a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#publicNav" aria-controls="publicNav" aria-expanded="false" aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse justify-content-end" id="publicNav">
      <div class="d-flex align-items-center gap-2 mt-2 mt-md-0">
        {% if user.is_authenticated %}
          <a href="{% url 'dashboard' %}" class="btn btn-gma btn-sm">Go to dashboard</a>
        {% else %}
          <a href="{% url 'login' %}" class="btn btn-outline-secondary btn-sm">Log in</a>
          <a href="{% url 'register' %}" class="btn btn-gma btn-sm">Get Started</a>
        {% endif %}
      </div>
    </div>
  </div>
</nav>

<main id="main-content">
{% block content %}{% endblock %}
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
